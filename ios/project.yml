name: Strata
options:
  bundleIdPrefix: net.nicolasruiz
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  StrataCore:
    path: .
targets:
  Strata:
    type: application
    platform: iOS
    sources:
      - path: Strata
      - path: ../img
        type: folder
        buildPhase: resources
    dependencies:
      - package: StrataCore
      - target: StrataWatch
    info:
      path: Strata/Info.plist
      properties:
        CFBundleDisplayName: Strata
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, Inter-ExtraBold.ttf]
        NSLocationWhenInUseUsageDescription: Strata uses your location during outdoor workouts to measure elevation gain.
        NSHealthShareUsageDescription: Strata reads your steps to show your daily activity alongside your training.
        NSHealthUpdateUsageDescription: Strata saves your strength and cardio workouts and heart rate to Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nicolasruiz.strata
        CODE_SIGN_ENTITLEMENTS: Strata/Strata.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  StrataWatch:
    type: application
    platform: watchOS
    sources:
      - path: StrataWatch
      - path: Strata/Fonts
      - path: ../img
        type: folder
        buildPhase: resources
    dependencies:
      - package: StrataCore
    info:
      path: StrataWatch/Info.plist
      properties:
        CFBundleDisplayName: Strata
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, Inter-ExtraBold.ttf]
        WKApplication: true
        WKCompanionAppBundleIdentifier: net.nicolasruiz.strata
        ITSAppUsesNonExemptEncryption: false
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Strata reads your heart rate during workouts.
        NSHealthUpdateUsageDescription: Strata saves your workouts and heart rate to Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nicolasruiz.strata.watchkitapp
        CODE_SIGN_ENTITLEMENTS: StrataWatch/StrataWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Strata:
    build:
      targets:
        Strata: all
        StrataWatch: all
    run:
      config: Debug
      debugEnabled: false
    test:
      config: Debug
  StrataWatch:
    build:
      targets:
        StrataWatch: all
